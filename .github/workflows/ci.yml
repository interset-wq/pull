name: CI

# PR 与 main push 均跑静态检查、测试与一次 Android 构建，回归风险不靠本地自觉。
# Flutter / JDK 版本与 release.yml 保持一致，避免「CI 绿但发版构建挂」。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  # 单独的构建任务：清单合并、图标资源、插件/Kotlin 兼容这类问题测试跑不出来，
  # 只有真正 assemble 才会暴露（例如 activity-alias 导致的启动入口问题）。
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (arm64)
        run: flutter build apk --debug --target-platform android-arm64
