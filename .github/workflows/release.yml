name: Release

# 推送 v* 标签触发：校验 pubspec 版本号与 tag 一致 → 构建 arm64-only
# release APK → 创建 GitHub Release 并上传，避免手动上传造成 APK 与
# 源码构建不一致。发版流程：改 pubspec version → commit → 打同名 tag。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches pubspec version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION="$(grep -oP '^version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' pubspec.yaml)"
          echo "tag=${GITHUB_REF_NAME} pubspec=${PUBSPEC_VERSION}"
          if [ "$VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 pubspec.yaml version ${PUBSPEC_VERSION} 不一致——请先提交版本号改动再打 tag"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # release 签名 keystore（build.gradle.kts 读 KEYSTORE_PATH）。AGP 对
      # debug keystore 的默认路径解析在 CI 上不可靠，曾混入 runner 镜像自带
      # 的 keystore，导致 CI 产物无法升级安装本地构建的应用。
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build arm64 release APK
        run: flutter build apk --split-per-abi --target-platform android-arm64

      # 构建后断言 APK 签名证书 == keystore 证书，杜绝签名再次漂移
      - name: Verify APK signature matches keystore
        run: |
          KS_SHA=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass android \
            -alias androiddebugkey | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
          APK_SHA=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | \
            grep 'SHA-256 digest' | head -1 | sed 's/.*digest: //')
          echo "keystore=$KS_SHA"
          echo "apk    =$APK_SHA"
          if [ -z "$APK_SHA" ] || [ "$KS_SHA" != "$APK_SHA" ]; then
            echo "::error::APK 签名与 keystore 不一致——签名配置漂移，禁止发布"
            exit 1
          fi

      - name: Create release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          generate_release_notes: true
